<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Trending Hub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Adsgram SDK — used automatically when admin sets the ad type to "adsgram" -->
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<!-- Monetag SDK — Rewarded Interstitial -->
<script src='//libtl.com/sdk.js' data-zone='11415029' data-sdk='show_11415029'></script>
<link rel="stylesheet" href="style.css" />
<style>
  /* Thumbnail: black placeholder + shimmer while loading, matches the
     reference's black thumbnail area exactly until our real image loads. */
  #unlockCard .wc-thumb-wrap.skeleton {
    background: linear-gradient(90deg, #0d0a06 25%, #1c1710 37%, #0d0a06 63%);
    background-size: 400% 100%;
    animation: wc-shimmer 1.4s ease infinite;
  }
  @keyframes wc-shimmer {
    0% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  #unlockCard .wc-thumb-wrap img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity .25s ease;
  }
  #unlockCard .wc-thumb-wrap img.loaded {
    opacity: 1;
  }
  /* Title: shimmer bar while loading (dark-on-yellow), replaced by real text */
  #unlockCard .wc-title.skeleton {
    display: inline-block;
    width: 60%;
    height: 1em;
    border-radius: 6px;
    background: linear-gradient(90deg, rgba(26,19,0,0.18) 25%, rgba(26,19,0,0.3) 37%, rgba(26,19,0,0.18) 63%);
    background-size: 400% 100%;
    animation: wc-shimmer 1.4s ease infinite;
    color: transparent;
  }
</style>
</head>
<body class="watch-body">

  <div id="unlockCard" class="unlock-card-v2">
    <div class="wc-thumb-wrap skeleton" id="wcThumbWrap">
      <img id="wcThumb" alt="" />
    </div>
    <div class="wc-title skeleton" id="wcTitle">&nbsp;</div>
    <div class="wc-progress-box">
      <span id="wcProgressText">Watched: 0 / 5</span>
    </div>
    <div class="wc-hint">ভিডিওটি আনলক করতে সম্পূর্ণ অ্যাডটি দেখুন।</div>

    <!-- Free-credit CTA: green + skips ads directly when credits are
         available; gray + routes to Refer when there are none. Always
         visible (never hidden), per the reference design. -->
    <button class="wc-btn-free gray" id="freeCreditBtn">🎁 +2 Free Videos Unlocked</button>

    <button class="wc-btn-dark" id="unlockBtn">▶ Watch Ad</button>
  </div>

  <div id="loadingState" class="watch-loading" hidden>
    <div class="spinner-ring"><span>▶</span></div>
    <div class="watch-title">অ্যাড লোড হচ্ছে...</div>
  </div>

  <div id="successState" class="success-wrap" hidden>
    <div class="check-circle">✓</div>
    <div class="success-title">সফলভাবে সম্পন্ন হয়েছে!</div>
    <div class="success-sub">ভিডিওটি পেতে ইনবক্স চেক করুন।</div>
    <div class="note-lock">নোট: এই ভিডিওটি আগামী ২৪ ঘণ্টার জন্য লক করা হয়েছে। ভিডিওটি ৫ মিনিট পর ইনবক্স থেকে মুছে যাবে।</div>
    <button class="primary-btn" id="checkInboxBtn">ইনবক্স চেক করুন</button>
  </div>

  <div id="errorState" hidden>
    <div class="watch-title">⚠️ কিছু একটা ভুল হয়েছে</div>
    <div class="watch-sub" id="errorMsg">আবার চেষ্টা করুন।</div>
    <button class="primary-btn" onclick="location.reload()">আবার চেষ্টা করুন</button>
  </div>

  <script src="watch.js"></script>
</body>
</html>
