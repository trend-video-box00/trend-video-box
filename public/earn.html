<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Trending Hub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<!-- Monetag SDK — Rewarded Interstitial -->
<script src='//libtl.com/sdk.js' data-zone='11415029' data-sdk='show_11415029'></script>
<link rel="stylesheet" href="style.css" />
<style>
  .earn-header { padding: 4px 4px 16px; }
  .earn-header h2 { margin: 0 0 4px; font-size: 1.15rem; }
  .earn-header p { margin: 0; font-size: .85rem; opacity: .7; }
  .earn-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .earn-tab { flex: 1; padding: 10px; text-align: center; border-radius: 12px; font-weight: 600; cursor: pointer; background: rgba(255,255,255,.05); }
  .earn-tab.active { background: #ef4b4b; color: #fff; }
  .network-card { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: rgba(255,255,255,.03); margin-bottom: 12px; }
  .network-icon { width: 42px; height: 42px; border-radius: 10px; background: #1a1a1a; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; }
  .network-info { flex: 1; min-width: 0; }
  .network-name { font-weight: 600; font-size: .95rem; }
  .network-name .reward { color: #ef4b4b; margin-left: 6px; }
  .network-progress-bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.08); margin-top: 8px; overflow: hidden; }
  .network-progress-fill { height: 100%; background: #ef4b4b; width: 0%; }
  .network-progress-text { font-size: .75rem; opacity: .6; margin-top: 4px; }
  .network-watch-btn { padding: 10px 18px; border-radius: 999px; background: #ef4b4b; color: #fff; border: none; font-weight: 700; white-space: nowrap; }
  .network-watch-btn:disabled { background: #444; opacity: .6; }
</style>
</head>
<body class="page-body">
  <header class="topbar">
    <div class="brand">Trending <span>Hub</span></div>
    <div class="user-chip"><span id="balanceChip">$0.00</span></div>
  </header>
  <main class="home-wrap">
    <div class="earn-header">
      <h2>Watch ads to earn</h2>
      <p>Each network has its own daily limit — watch them all for maximum earnings.</p>
    </div>

    <div class="earn-tabs">
      <div class="earn-tab active" id="tabAds">Ads</div>
      <div class="earn-tab" id="tabArticles">Articles</div>
    </div>

    <!-- Ad network cards (Adsgram Daily, Adsgram Special, Monetag, GigaPub)
         are built dynamically in earn.js so quantities/rewards/progress can
         be updated from one place without touching this HTML. -->
    <div id="adsPanel">
      <div id="networkList"></div>
    </div>

    <div id="articlesPanel" hidden>
      <div id="taskList"></div>
    </div>
  </main>
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10.5L12 3z"/></svg></span><span>Home</span></a>
    <a href="videos.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3.2v10.4L16 14v-4z"/></svg></span><span>Videos</span></a>
    <a href="earn.html" class="nav-item active"><span class="nav-icon"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v4.5c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/><path d="M4 11.5V16c0 1.66 3.58 3 8 3s8-1.34 8-3v-4.5"/></svg></span><span>Earn</span></a>
    <a href="rank.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M11 2l1.5 3 3.3.4-2.4 2.3.6 3.3L11 9.5 8 11l.6-3.3L6.2 5.4l3.3-.4L11 2z"/><rect x="3" y="14" width="4" height="7" rx="1"/><rect x="10" y="11" width="4" height="10" rx="1"/><rect x="17" y="16" width="4" height="5" rx="1"/></svg></span><span>Rank</span></a>
  </nav>
  <script src="earn.js"></script>
</body>
</html>
