<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Trending Hub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css" />
<style>
  /* Small animated badge above the refer link/copy row. */
  .refer-bonus-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 12px;
    background: rgba(56, 224, 123, 0.08);
    border: 1px solid rgba(56, 224, 123, 0.25);
    margin: 12px 0 16px;
    font-size: 13px;
    font-weight: 700;
    color: var(--green-glow, #38e07b);
    animation: refer-badge-pulse 2.2s ease-in-out infinite;
  }
  .refer-bonus-badge .badge-sub {
    font-weight: 500;
    opacity: .75;
    font-size: 11.5px;
  }
  @keyframes refer-badge-pulse {
    0%, 100% { box-shadow: 0 0 0 rgba(56, 224, 123, 0); }
    50% { box-shadow: 0 0 14px rgba(56, 224, 123, 0.35); }
  }
</style>
</head>
<body class="page-body">
  <header class="topbar">
    <div class="brand">Trending <span>Hub</span></div>
  </header>
  <main class="home-wrap">
    <div class="refer-card">
      <div class="section-title" style="margin-top:0;">আপনার রেফার লিংক</div>
      <div style="font-size:12.5px; color:var(--text-dim);">এই লিংক দিয়ে কেউ প্রথমবার বট ওপেন করলে তা আপনার রেফার হিসেবে গণনা হবে।</div>

      <div class="refer-bonus-badge" id="referBonusBadge">
        🎁 +2 Videos Free <span class="badge-sub">প্রতি ১০ জন রেফারে</span>
      </div>

      <div class="refer-link-row">
        <input type="text" id="referLink" class="refer-link-input" readonly />
        <button class="copy-btn" id="copyBtn">কপি</button>
      </div>
    </div>
    <div class="refer-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <div class="section-title" style="margin:0;">মোট রেফার</div>
        <div style="font-size:22px; font-weight:800; color:var(--green-glow);" id="referralCount">0</div>
      </div>
      <div style="font-size:12px; color:var(--text-dim); margin-bottom:14px;">
        বোনাস আপনার নিজের রেফার করার উপর ভিত্তি করে — যাকে রেফার করেছেন সে কী করছে তার উপর না।
      </div>
      <div id="milestoneList"></div>
    </div>
  </main>
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10.5L12 3z"/></svg></span><span>Home</span></a>
    <a href="videos.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3.2v10.4L16 14v-4z"/></svg></span><span>Videos</span></a>
    <a href="earn.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v4.5c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/><path d="M4 11.5V16c0 1.66 3.58 3 8 3s8-1.34 8-3v-4.5"/></svg></span><span>Earn</span></a>
    <a href="rank.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M11 2l1.5 3 3.3.4-2.4 2.3.6 3.3L11 9.5 8 11l.6-3.3L6.2 5.4l3.3-.4L11 2z"/><rect x="3" y="14" width="4" height="7" rx="1"/><rect x="10" y="11" width="4" height="10" rx="1"/><rect x="17" y="16" width="4" height="5" rx="1"/></svg></span><span>Rank</span></a>
  </nav>
  <script src="refer.js"></script>
</body>
</html>
