<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Cricket UI</title>
    <style>
        /* ফন্ট ইমপোর্ট */
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117; /* ডার্ক ব্যাকগ্রাউন্ড */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Roboto', sans-serif;
            color: white;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 500px;
        }

        /* হেডার অংশ */
        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .red-dot {
            width: 25px;
            height: 25px;
            background-color: #ff0000;
            border-radius: 50%;
            margin-right: 12px;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
            margin: 0;
        }

        /* থাম্বনেইল অংশ */
        .thumbnail-container {
            position: relative;
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #30363d;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .thumbnail-container:hover {
            transform: scale(1.02);
        }

        .thumbnail-container img {
            width: 100%;
            display: block;
        }

        /* লাইভ ব্যাজ (ইমেজের ওপর) */
        .live-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 12px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
        }

        .small-dot {
            width: 10px;
            height: 10px;
            background-color: #ff0000;
            border-radius: 50%;
            margin-right: 6px;
        }

        /* প্লে বাটন আইকন */
        .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .play-triangle {
            width: 0;
            height: 0;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-left: 25px solid white;
            margin-left: 5px;
        }

        /* হলুদ বাটন */
        .live-btn {
            background-color: #ffcc00; /* একদম ছবির মতো হলুদ কালার */
            color: black;
            border: none;
            padding: 15px 40px;
            border-radius: 12px;
            font-size: 22px;
            font-weight: 900;
            margin-top: 30px;
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.3s;
        }

        .live-btn:hover {
            background-color: #e6b800;
        }

        .btn-dot {
            width: 20px;
            height: 20px;
            background-color: #ff0000;
            border-radius: 50%;
            margin-right: 10px;
            border: 2px solid black;
        }

        /* নিচের টেক্সট */
        .footer-text {
            margin-top: 15px;
            font-size: 16px;
            font-weight: 500;
            color: #d1d5db;
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- হেডার -->
        <div class="header">
            <div class="red-dot"></div>
            <h1>LIVE WATCH CRICKET</h1>
        </div>

        <!-- থাম্বনেইল কার্ড -->
        <div class="thumbnail-container">
            <img src="https://i.postimg.cc/tTnMK7kr/f9eu8o.jpg" alt="Live Cricket">
            
            <div class="live-badge">
                <div class="small-dot"></div> LIVE
            </div>

            <div class="play-overlay">
                <div class="play-triangle"></div>
            </div>
        </div>

        <!-- মেইন বাটন -->
        <a href="#" class="live-btn">
            <div class="btn-dot"></div> LIVE ONE
        </a>

        <!-- ফুটারের লেখা -->
        <p class="footer-text">Tap the thumbnail or the button 👇</p>
    </div>

</body>
</html>
